services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: main-service
        SERVICE_PORT: 8001
    container_name: eh-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    # .env is Git-ignored; host environment variables override values in it.
    env_file:
      - .env
    networks:
      - eh-net

  scraper-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: scraper-worker
        SERVICE_PORT: 8081
    container_name: eh-scraper-worker
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    networks:
      - eh-net

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ai-service
        SERVICE_PORT: 8082
    container_name: eh-ai-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    networks:
      - eh-net

  frontend:
    build:
      context: ./前端
      dockerfile: Dockerfile
    container_name: eh-frontend
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      - backend
    networks:
      - eh-net

networks:
  eh-net:
    driver: bridge
