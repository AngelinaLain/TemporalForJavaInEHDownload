services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: main-service
        SERVICE_PORT: 8001
    container_name: eh-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    # .env is Git-ignored; host environment variables override values in it.
    env_file:
      - .env
    environment:
      # 断点文件必须跨容器重启保留；可通过 .env 覆盖为宿主机挂载路径。
      DOWNLOAD_TEMP_DIR: ${DOWNLOAD_TEMP_DIR:-/data/download-cache}
      RSS_ENABLED: ${RSS_ENABLED:-true}
      RSS_HUB_URL: http://rsshub:1200
    volumes:
      - download-cache:/data/download-cache
    networks:
      - eh-net

  # 搜索订阅源仅供内部后端访问；无需浏览器容器或额外公开端口。
  rsshub:
    image: ${RSSHUB_IMAGE:-diygod/rsshub@sha256:3a207d5a1eb1597c908f0858ca6d4794d9773605e2d259c736d160b784704797}
    restart: unless-stopped
    command: ['sh', '/usr/local/bin/gallery-rsshub-start.sh']
    volumes:
      - ./deploy/rsshub-start.sh:/usr/local/bin/gallery-rsshub-start.sh:ro
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: ${RSSHUB_REDIS_URL:-redis://redis:6379/2}
      CACHE_EXPIRE: '300'
      CACHE_CONTENT_EXPIRE: '300'
      EH_IPB_MEMBER_ID: ${EH_MEMBER_ID:-}
      EH_IPB_PASS_HASH: ${EH_PASS_HASH:-}
      EH_SK: ${EH_SK:-}
      EH_STAR: ${EH_STAR:-}
      PROXY_URI: ${RSSHUB_PROXY_URI:-}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-7893}
      PROXY_PROTOCOL: ${PROXY_TYPE:-http}
      PROXY_AUTH: ${RSSHUB_PROXY_AUTH:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    depends_on:
      - redis
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:1200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - eh-net

  scraper-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: scraper-worker
        SERVICE_PORT: 8081
    container_name: eh-scraper-worker
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    networks:
      - eh-net

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ai-service
        SERVICE_PORT: 8082
    container_name: eh-ai-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - ./models:/models:ro
    networks:
      - eh-net

  frontend:
    build:
      context: ./前端
      dockerfile: Dockerfile
    container_name: eh-frontend
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      - backend
    networks:
      - eh-net

  # ── Redis：JWT 黑名单 / AI 翻译缓存跨实例共享 ──
  redis:
    image: redis:7-alpine
    container_name: eh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - eh-net

  # ── 可观测性（可选：docker compose --profile observability up -d 启用） ──
  prometheus:
    image: prom/prometheus:latest
    container_name: eh-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - eh-net

  grafana:
    image: grafana/grafana:latest
    container_name: eh-grafana
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # 允许前端 iframe 内嵌展示大盘
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # 匿名只读访问，便于免登录在监控大盘页面直接展示
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # 登录后/匿名用户默认直达监控大盘
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/galleryimport-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      # 预置 Prometheus / Loki 数据源，开箱即用
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      # 预置监控仪表盘
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - eh-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: eh-zipkin
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - eh-net

  loki:
    image: grafana/loki:latest
    container_name: eh-loki
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - eh-net

  promtail:
    image: grafana/promtail:latest
    container_name: eh-promtail
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - eh-net

networks:
  eh-net:
    driver: bridge

volumes:
  redis-data:
  grafana-data:
  download-cache:
