# Prometheus 抓取配置：main-service / scraper-worker / ai-service 的 /actuator/prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'main-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8001']

  - job_name: 'scraper-worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['scraper-worker:8081']

  - job_name: 'ai-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ai-service:8082']
