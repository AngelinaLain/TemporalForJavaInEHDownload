spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: main-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:eh_automation}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  temporal:
    connection:
      target: ${TEMPORAL_HOST}:${TEMPORAL_PORT:7233}
    namespace: default
    workers-auto-discovery:
      packages:
        - com.checker
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.checker.entity
  configuration:
    map-underscore-to-camel-case: true
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
server:
  port: 8001

# 安全配置
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000  # 24小时(毫秒)
  admin:
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8002,http://127.0.0.1:8002}

eh-config:
  cookies:
    member-id: ${EH_MEMBER_ID}
    pass-hash: ${EH_PASS_HASH}
    sk: ${EH_SK}
    star: ${EH_STAR}
  # 代理信息
  proxy:
    host: ${PROXY_HOST}
    port: ${PROXY_PORT:7893}
    username: ${PROXY_USERNAME}
    password: ${PROXY_PASSWORD}
    type: ${PROXY_TYPE:http}
  synology:
    url: ${SYNOLOGY_URL}
    username: ${SYNOLOGY_USERNAME}
    password: ${SYNOLOGY_PASSWORD}
    destination: ${SYNOLOGY_DESTINATION}
  notification:
    admin-email: ${NOTIFICATION_ADMIN_EMAIL}
    tenant-id: ${GRAPH_TENANT_ID}
    client-id: ${GRAPH_CLIENT_ID}
    client-secret: ${GRAPH_CLIENT_SECRET}
    sender-email: ${GRAPH_SENDER_EMAIL}
  komga:
    url: ${KOMGA_URL}
    api-key: ${KOMGA_API_KEY}
    library-id: ${KOMGA_LIBRARY_ID}
  # 工作流运行时参数（可在线调整，无需重新编译）
  workflow:
    # 最大子工作流个数
    max-concurrency: 6
    # komga最大尝试次数
    komga-import-max-retries: 20
    # 多少时间轮询komga的元数据状态 [秒]
    komga-import-poll-interval-seconds: 15
    # 多少时间去群晖检查是否下载完成 [分钟]
    download-poll-interval-minutes: 5
    # 每次下载后的等待时间 [秒]
    download-cooldown-seconds: 10
