spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: main-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:eh_automation}?serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  temporal:
    connection:
      target: ${TEMPORAL_HOST}:${TEMPORAL_PORT:7233}
    namespace: default
    workers-auto-discovery:
      packages:
        - com.checker
  threads:
    virtual:
      # 仅 Java 21+ 可开启（Spring Boot 3.2 特性），Java 17 下由 VirtualThreadConfig 自动回退
      enabled: ${VIRTUAL_THREADS_ENABLED:false}
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.checker.entity
  configuration:
    map-underscore-to-camel-case: true
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
server:
  port: 8001

# 安全配置
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000  # 24小时(毫秒)
  admin:
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8002,http://127.0.0.1:8002}

eh-config:
  cookies:
    member-id: ${EH_MEMBER_ID}
    pass-hash: ${EH_PASS_HASH}
    sk: ${EH_SK}
    star: ${EH_STAR}
  # 代理信息
  proxy:
    host: ${PROXY_HOST}
    port: ${PROXY_PORT:7893}
    username: ${PROXY_USERNAME}
    password: ${PROXY_PASSWORD}
    type: ${PROXY_TYPE:http}
  synology:
    url: ${SYNOLOGY_URL}
    username: ${SYNOLOGY_USERNAME}
    password: ${SYNOLOGY_PASSWORD}
    destination: ${SYNOLOGY_DESTINATION}
  notification:
    admin-email: ${NOTIFICATION_ADMIN_EMAIL}
    tenant-id: ${GRAPH_TENANT_ID}
    client-id: ${GRAPH_CLIENT_ID}
    client-secret: ${GRAPH_CLIENT_SECRET}
    sender-email: ${GRAPH_SENDER_EMAIL}
  komga:
    url: ${KOMGA_URL}
    api-key: ${KOMGA_API_KEY}
    library-id: ${KOMGA_LIBRARY_ID}
  # 工作流运行时参数（可在线调整，无需重新编译）
  workflow:
    # 最大子工作流个数
    max-concurrency: 6
    # komga最大尝试次数
    komga-import-max-retries: 20
    # 多少时间轮询komga的元数据状态 [秒]
    komga-import-poll-interval-seconds: 15
    # 多少时间去群晖检查是否下载完成 [分钟]
    download-poll-interval-minutes: 5
    # 每次下载后的等待时间 [秒]
    download-cooldown-seconds: 10
  # EHentai API 全局限流（Resilience4j 令牌桶，防止被封禁）
  rate-limit:
    enabled: true
    limit-for-period: 30        # 每个刷新周期允许 30 个请求
    limit-refresh-period-seconds: 60
    timeout-duration-seconds: 30
    proxy-cooldown-seconds: 300 # 403/502 后当前代理冷却 5 分钟
  # 多代理轮换池（可选，配置后优先于单一 proxy 使用）
  # proxy-pool:
  #   - host: ${PROXY_HOST}
  #     port: ${PROXY_PORT:7893}
  #     username: ${PROXY_USERNAME}
  #     password: ${PROXY_PASSWORD}
  # 多账号 Cookie 轮转池（可选，配置后优先于单一 cookies 使用）
  # cookie-pool:
  #   - member-id: ${EH_MEMBER_ID}
  #     pass-hash: ${EH_PASS_HASH}
  #     sk: ${EH_SK}
  #     star: ${EH_STAR}

# Jasypt 配置加密：配置 ${ENC(密文)} 占位符时使用；留空则明文直读
jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:}

# Resilience4j 断路器：AI 端点连续失败自动熔断 → 本地词典降级
resilience4j:
  circuitbreaker:
    instances:
      aiSummary:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      aiTagTranslation:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 120s
        permitted-number-of-calls-in-half-open-state: 2

# 可观测性：Actuator + Prometheus + Zipkin 链路追踪
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
