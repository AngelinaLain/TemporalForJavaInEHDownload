server:
  port: 8082

# Temporal 空闲长轮询超时会自动重试；默认不输出预期的 INFO 级完整堆栈。
logging:
  level:
    io.temporal.internal.worker.BasePoller: ${TEMPORAL_POLLER_LOG_LEVEL:WARN}

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  application:
    name: eh-ai-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
  temporal:
    connection:
      target: ${TEMPORAL_HOST}:${TEMPORAL_PORT:7233}
    namespace: default
    workers-auto-discovery:
      packages:
        - com.checker
  ai:
    openai:
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_MODEL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
